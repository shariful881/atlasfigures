name: Check (dev)
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          SITE_URL: https://shariful881.github.io
          SITE_BASE: /atlasfigures
          PUBLIC_INDEXABLE: 'false'
